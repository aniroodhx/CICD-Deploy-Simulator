apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-sim-app
  labels:
    app: deploy-sim-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deploy-sim-app
  template:
    metadata:
      labels:
        app: deploy-sim-app
    spec:
      containers:
        - name: app
          image: deploy-sim-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "local"
            - name: GREETING
              value: "Hello from the deploy simulator"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
