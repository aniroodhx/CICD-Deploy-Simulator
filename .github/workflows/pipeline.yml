name: pipeline

# Real build -> test -> push pipeline. Deploy step is added in Phase 2
# once Terraform provisions the target cluster.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/deploy-sim-app

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test
        working-directory: app
        run: npm test

      - name: Build image
        working-directory: app
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
