name: pipeline

# Real build -> test -> push pipeline. Deploy step is added in Phase 2
# once Terraform provisions the target cluster.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # GHCR repository names must be lowercase; github.repository can contain
      # uppercase, so lowercase it here into $IMAGE for the later steps.
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/deploy-sim-app" >> "$GITHUB_ENV"

      - name: Test
        working-directory: app
        run: npm test

      - name: Build image
        working-directory: app
        run: docker build -t "$IMAGE:${GITHUB_SHA::7}" -t "$IMAGE:latest" .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"